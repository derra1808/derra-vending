<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini Course — Derra Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <header class="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-title">🏎️ MINI COURSE</div>
      <div class="hud-item hud-right">
        <span class="hud-label">Vitesse</span>
        <span id="speed" class="hud-value">0</span>
      </div>
    </header>

    <canvas id="game" width="420" height="640"></canvas>

    <div class="touch-controls" id="touchControls">
      <button type="button" id="btnLeft" aria-label="Gauche">◀</button>
      <button type="button" id="btnRight" aria-label="Droite">▶</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="panel">
        <p class="tag">Arcade · Genève</p>
        <h1>Mini Course</h1>
        <p class="desc">Évite les voitures. Tiens le plus longtemps possible.</p>
        <ul class="controls">
          <li><kbd>←</kbd> <kbd>→</kbd> ou <kbd>A</kbd> <kbd>D</kbd></li>
          <li>Mobile : boutons en bas</li>
        </ul>
        <button type="button" id="btnStart" class="btn">Démarrer</button>
        <p class="best">Record : <span id="best">0</span></p>
      </div>
    </div>

    <div class="overlay hidden" id="gameOver">
      <div class="panel panel--over">
        <h2>Crash ! 💥</h2>
        <p class="score-final">Score : <strong id="finalScore">0</strong></p>
        <p class="record-msg hidden" id="newRecord">🎉 Nouveau record !</p>
        <button type="button" id="btnRestart" class="btn">Rejouer</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
